name: NMHS UPSTREAM-002 G6 Selective Reconciliation Control

on:
  push:
    branches:
      - upstream-002-g6-selective-nonconflict-v1
    paths:
      - '.github/workflows/nmhs-upstream-002-g6-selective-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-build-test:
    name: Prove selective upstream reconciliation
    runs-on: ubuntu-latest

    env:
      ACCEPTED_BASE: d85ee48226a2d4c9831c9adaa5ac06e3584d6dc7
      UPSTREAM_FEATURE: 6afeda361e3e321e7dd3d764016d1d5941ce7c6c
      TASK_FORM_FEATURE: a9023790fdaac83b74a90a0341d018157d78aea0
      CONTROL_WORKFLOW: .github/workflows/nmhs-upstream-002-g6-selective-reconciliation.yml
      HARNESS_RECONCILIATION: src/setupTests.js
      NOTIFICATION_RECONCILIATION: src/components/Notification/Notification.jsx
      EN_LOCALE_RECONCILIATION: public/i18n/locale_en.json
      CARE_VIEW_RECONCILIATION: src/entries/CareViewDashboard/CareViewDashboard.jsx
      DASHBOARD_RECONCILIATION: src/entries/Dashboard/Dashboard.jsx
      NOTIFICATION_SNAPSHOT: src/components/Notification/__snapshots__/Notification.spec.jsx.snap
      TASK_TILE_RECONCILIATION: src/features/DisplayControls/NursingTasks/components/TaskTile.jsx
      TASK_MOCK_RECONCILIATION: src/features/DisplayControls/NursingTasks/tests/NursingTasksUtilsMockData.js
      TASK_TEST_COMPAT: src/features/DisplayControls/NursingTasks/tests/TaskTile.spec.jsx
      UPDATE_NURSING_RECONCILIATION: src/features/DisplayControls/NursingTasks/components/UpdateNursingTasks.jsx
      UPDATE_NURSING_TEST_RECONCILIATION: src/features/DisplayControls/NursingTasks/tests/UpdateNursingTasks.spec.jsx
      UPDATE_NURSING_SNAPSHOT_PRESERVE: src/features/DisplayControls/NursingTasks/tests/__snapshots__/UpdateNursingTasks.spec.jsx.snap
      UPDATE_NURSING_SNAPSHOT_RECONCILIATION: src/features/DisplayControls/NursingTasks/tests/__snapshots__/UpdateNursingTasks.spec.jsx.snap
      TASK_FORM_LINK: src/features/DisplayControls/NursingTasks/components/TaskFormLink.jsx
      TASK_FORM_LINK_STYLE: src/features/DisplayControls/NursingTasks/styles/TaskFormLink.scss
      TASK_FORM_CONSTANTS: src/constants.js
      TASK_FORM_UTILS: src/features/DisplayControls/NursingTasks/utils/NursingTasksUtils.js
      CARE_INSTRUCTIONS_COMPONENT: src/features/DisplayControls/CareInstructions/components/CareInstructions.jsx
      CARE_INSTRUCTIONS_STYLE: src/features/DisplayControls/CareInstructions/styles/CareInstructions.scss
      CARE_INSTRUCTIONS_TEST: src/features/DisplayControls/CareInstructions/tests/CareInstructions.spec.jsx
      CARE_INSTRUCTIONS_UTILS: src/features/DisplayControls/CareInstructions/utils/CareInstructionsUtils.jsx
      CARE_INSTRUCTIONS_UTILS_TEST: src/features/DisplayControls/CareInstructions/utils/CareInstructionsUtils.test.js
      CARE_INSTRUCTIONS_MAPPING: src/entries/Dashboard/componentMapping.js

    steps:
      - name: Checkout NMHS control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove control-only branch delta
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$ACCEPTED_BASE^{commit}"
          git diff --name-only "$ACCEPTED_BASE" HEAD | sort > /tmp/control-delta.txt
          cat /tmp/control-delta.txt
          test "$(wc -l < /tmp/control-delta.txt)" -eq 16
          grep -Fxq "$CONTROL_WORKFLOW" /tmp/control-delta.txt
          grep -Fxq "$HARNESS_RECONCILIATION" /tmp/control-delta.txt
          grep -Fxq "$NOTIFICATION_RECONCILIATION" /tmp/control-delta.txt
          grep -Fxq "$EN_LOCALE_RECONCILIATION" /tmp/control-delta.txt
          grep -Fxq "$CARE_VIEW_RECONCILIATION" /tmp/control-delta.txt
          grep -Fxq "$DASHBOARD_RECONCILIATION" /tmp/control-delta.txt
          grep -Fxq "$NOTIFICATION_SNAPSHOT" /tmp/control-delta.txt
          grep -Fxq "$TASK_TILE_RECONCILIATION" /tmp/control-delta.txt
          grep -Fxq "$TASK_TEST_COMPAT" /tmp/control-delta.txt
          grep -Fxq "$UPDATE_NURSING_RECONCILIATION" /tmp/control-delta.txt
          grep -Fxq "$UPDATE_NURSING_TEST_RECONCILIATION" /tmp/control-delta.txt
          grep -Fxq "$UPDATE_NURSING_SNAPSHOT_RECONCILIATION" /tmp/control-delta.txt
          grep -Fxq "$TASK_FORM_LINK" /tmp/control-delta.txt
          grep -Fxq "$TASK_FORM_LINK_STYLE" /tmp/control-delta.txt
          grep -Fxq "$TASK_FORM_CONSTANTS" /tmp/control-delta.txt
          grep -Fxq "$TASK_FORM_UTILS" /tmp/control-delta.txt

      - name: Fetch exact upstream feature source
        shell: bash
        run: |
          set -euo pipefail
          git remote remove bahmni-upstream 2>/dev/null || true
          git remote add bahmni-upstream https://github.com/Bahmni/openmrs-module-ipd-frontend.git
          git fetch --no-tags bahmni-upstream "$UPSTREAM_FEATURE"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_FEATURE"
          git cat-file -e "$UPSTREAM_FEATURE^"
          git fetch --no-tags bahmni-upstream "$TASK_FORM_FEATURE"
          test "$(git rev-parse FETCH_HEAD)" = "$TASK_FORM_FEATURE"
          git cat-file -e "$TASK_FORM_FEATURE^"

          git show "$TASK_FORM_FEATURE:$TASK_FORM_LINK" > /tmp/upstream-task-form-link.jsx
          diff -u /tmp/upstream-task-form-link.jsx "$TASK_FORM_LINK"
          git show "$TASK_FORM_FEATURE:$TASK_FORM_LINK_STYLE" > /tmp/upstream-task-form-link.scss
          diff -u /tmp/upstream-task-form-link.scss "$TASK_FORM_LINK_STYLE"
          grep -Fq 'export const CLINICAL_FORM_URL' "$TASK_FORM_CONSTANTS"
          grep -Fq 'export const getLatestFormUuid' "$TASK_FORM_UTILS"
          grep -Fq 'export const getFormNameFromTaskInput' "$TASK_FORM_UTILS"

          # Harness reconciliation must be the exact upstream feature-state file.
          git show "$UPSTREAM_FEATURE:$HARNESS_RECONCILIATION" > /tmp/upstream-setupTests.js
          diff -u /tmp/upstream-setupTests.js "$HARNESS_RECONCILIATION"

          # Notification reconciliation must be the exact upstream feature-state file.
          git show "$UPSTREAM_FEATURE:$NOTIFICATION_RECONCILIATION" > /tmp/upstream-notification.jsx
          diff -u /tmp/upstream-notification.jsx "$NOTIFICATION_RECONCILIATION"

          # Care View reconciliation must be the exact upstream feature-state file.
          git show "$UPSTREAM_FEATURE:$CARE_VIEW_RECONCILIATION" > /tmp/upstream-care-view.jsx
          diff -u /tmp/upstream-care-view.jsx "$CARE_VIEW_RECONCILIATION"

          # Preserve exact upstream source for bounded stopped-task fixture extraction.
          git show "$UPSTREAM_FEATURE:$TASK_MOCK_RECONCILIATION" > /tmp/upstream-task-mock.js

          git diff --name-only "$UPSTREAM_FEATURE^" "$UPSTREAM_FEATURE" | sort > /tmp/upstream-paths.txt
          cat /tmp/upstream-paths.txt
          test "$(wc -l < /tmp/upstream-paths.txt)" -eq 51

      - name: Reconcile only non-conflicting upstream paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g6-evidence

          set +e
          git cherry-pick --no-commit "$UPSTREAM_FEATURE"
          rc=$?
          set -e

          test "$rc" -ne 0

          git diff --name-only --diff-filter=U | sort > g6-evidence/conflicts.txt
          echo '=== CONFLICT PATHS ==='
          cat g6-evidence/conflicts.txt
          test "$(wc -l < g6-evidence/conflicts.txt)" -eq 11

          # Resolve every conflict by restoring the accepted NMHS file exactly.
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              "$TASK_TILE_RECONCILIATION"|"$EN_LOCALE_RECONCILIATION"|"$DASHBOARD_RECONCILIATION"|"$UPDATE_NURSING_RECONCILIATION"|"$UPDATE_NURSING_TEST_RECONCILIATION"|"$UPDATE_NURSING_SNAPSHOT_RECONCILIATION")
                git restore --source=HEAD --staged --worktree -- "$path"
                ;;
              "$TASK_MOCK_RECONCILIATION")
                git restore --source="$ACCEPTED_BASE" --staged --worktree -- "$path"
                python3 -c 'import re,sys; p,up=sys.argv[1:3]; s=open(p).read(); u=open(up).read(); anchor="export const mockShiftResponse = ["; m=re.search(r"export const mockStoppedNonMedicationTileData = \[.*?\];\n\n",u,re.S); (_ for _ in ()).throw(SystemExit("STOP: upstream stopped-task fixture not found")) if not m else None; (_ for _ in ()).throw(SystemExit("STOP: stopped-task fixture already present before bounded insertion")) if "mockStoppedNonMedicationTileData" in s else None; (_ for _ in ()).throw(SystemExit("STOP: mock fixture anchor missing")) if anchor not in s else None; open(p,"w").write(s.replace(anchor,m.group(0)+anchor,1))' "$path" /tmp/upstream-task-mock.js
                git add -- "$path"
                ;;
              *)
                if git cat-file -e "$ACCEPTED_BASE:$path" 2>/dev/null; then
                  git restore --source="$ACCEPTED_BASE" --staged --worktree -- "$path"
                else
                  git rm -f --ignore-unmatch -- "$path"
                fi
                ;;
            esac
          done < g6-evidence/conflicts.txt

          # Preserve reviewed NMHS full-suite snapshot IDs; upstream clean cherry-pick carries stale generated IDs.
          git restore --source=HEAD --staged --worktree -- "$UPDATE_NURSING_SNAPSHOT_RECONCILIATION"

          test -z "$(git diff --name-only --diff-filter=U)"

          # Care Instructions is a clean parent->feature family. Prove the candidate
          # carries the exact upstream aggregate bytes for its bounded core paths.
          for path in \
            "$CARE_INSTRUCTIONS_COMPONENT" \
            "$CARE_INSTRUCTIONS_STYLE" \
            "$CARE_INSTRUCTIONS_TEST" \
            "$CARE_INSTRUCTIONS_UTILS" \
            "$CARE_INSTRUCTIONS_UTILS_TEST" \
            "$CARE_INSTRUCTIONS_MAPPING"; do
            git cat-file -e "$UPSTREAM_FEATURE:$path"
            git show "$UPSTREAM_FEATURE:$path" > /tmp/upstream-care-instructions-file
            diff -u /tmp/upstream-care-instructions-file "$path"
          done

          # Preserve the reviewed NMHS snapshot for this bounded stop/unstop gate.
          # The obsolete cancel snapshot was intentionally removed after replacing it with a deterministic behavior assertion.
          git restore --source=HEAD --staged --worktree -- "$UPDATE_NURSING_SNAPSHOT_PRESERVE"
          snapshot_after="$(sha256sum "$UPDATE_NURSING_SNAPSHOT_RECONCILIATION" | awk '{print $1}')"
          snapshot_branch="$(git show HEAD:"$UPDATE_NURSING_SNAPSHOT_RECONCILIATION" | sha256sum | awk '{print $1}')"
          test "$snapshot_after" = "$snapshot_branch"

          git diff --name-only "$ACCEPTED_BASE" -- . ":(exclude)$CONTROL_WORKFLOW" ":(exclude)$HARNESS_RECONCILIATION" | sort > g6-evidence/applied-paths.txt
          echo '=== APPLIED NON-CONFLICT PATHS ==='
          cat g6-evidence/applied-paths.txt
          test "$(wc -l < g6-evidence/applied-paths.txt)" -eq 50

          comm -23 /tmp/upstream-paths.txt g6-evidence/conflicts.txt | grep -Fvx "$UPDATE_NURSING_SNAPSHOT_PRESERVE" > /tmp/nonconflict-paths.txt
          grep -Fxv "$UPDATE_NURSING_SNAPSHOT_RECONCILIATION" /tmp/nonconflict-paths.txt > /tmp/nonconflict-paths-reviewed.txt
          {
            cat /tmp/nonconflict-paths-reviewed.txt
            printf '%s\n' "$TASK_TILE_RECONCILIATION" "$TASK_MOCK_RECONCILIATION" "$EN_LOCALE_RECONCILIATION" "$DASHBOARD_RECONCILIATION" "$UPDATE_NURSING_RECONCILIATION" "$UPDATE_NURSING_TEST_RECONCILIATION" "$UPDATE_NURSING_SNAPSHOT_RECONCILIATION" "$NOTIFICATION_SNAPSHOT" "$TASK_FORM_LINK" "$TASK_FORM_LINK_STYLE"
          } | sort -u > g6-evidence/expected-applied-paths.txt
          diff -u g6-evidence/expected-applied-paths.txt g6-evidence/applied-paths.txt

          comm -12 g6-evidence/conflicts.txt g6-evidence/applied-paths.txt > /tmp/applied-conflicts.txt
          {
            printf '%s\n' "$TASK_TILE_RECONCILIATION" "$TASK_MOCK_RECONCILIATION" "$EN_LOCALE_RECONCILIATION" "$DASHBOARD_RECONCILIATION" "$UPDATE_NURSING_RECONCILIATION" "$UPDATE_NURSING_TEST_RECONCILIATION" "$UPDATE_NURSING_SNAPSHOT_RECONCILIATION"
          } | sort > /tmp/expected-applied-conflicts.txt
          diff -u /tmp/expected-applied-conflicts.txt /tmp/applied-conflicts.txt

      - name: Prove conflicted NMHS files are byte-identical to accepted base
        shell: bash
        run: |
          set -euo pipefail
          : > g6-evidence/conflict-preservation-sha256.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ "$path" = "$TASK_TILE_RECONCILIATION" ] || [ "$path" = "$EN_LOCALE_RECONCILIATION" ] || [ "$path" = "$DASHBOARD_RECONCILIATION" ] || [ "$path" = "$UPDATE_NURSING_RECONCILIATION" ] || [ "$path" = "$UPDATE_NURSING_TEST_RECONCILIATION" ] || [ "$path" = "$UPDATE_NURSING_SNAPSHOT_RECONCILIATION" ]; then
              after="$(sha256sum "$path" | awk '{print $1}')"
              branch_sha="$(git show HEAD:"$path" | sha256sum | awk '{print $1}')"
              test "$after" = "$branch_sha"
              printf 'RECONCILED %s  %s\n' "$after" "$path" >> g6-evidence/conflict-preservation-sha256.txt
            elif [ "$path" = "$TASK_MOCK_RECONCILIATION" ]; then
              count="$(grep -c '^export const mockStoppedNonMedicationTileData = ' "$path")"
              test "$count" -eq 1
              after="$(sha256sum "$path" | awk '{print $1}')"
              printf 'RECONCILED %s  %s\n' "$after" "$path" >> g6-evidence/conflict-preservation-sha256.txt
            elif git cat-file -e "$ACCEPTED_BASE:$path" 2>/dev/null; then
              before="$(git show "$ACCEPTED_BASE:$path" | sha256sum | awk '{print $1}')"
              after="$(sha256sum "$path" | awk '{print $1}')"
              test "$before" = "$after"
              printf '%s  %s\n' "$after" "$path" >> g6-evidence/conflict-preservation-sha256.txt
            else
              test ! -e "$path"
              printf 'ABSENT  %s\n' "$path" >> g6-evidence/conflict-preservation-sha256.txt
            fi
          done < g6-evidence/conflicts.txt
          cat g6-evidence/conflict-preservation-sha256.txt

      - name: Record immutable reconciliation provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "ACCEPTED_NMHS_BASE=$ACCEPTED_BASE"
            echo "UPSTREAM_FEATURE=$UPSTREAM_FEATURE"
            echo "TASK_FORM_FEATURE=$TASK_FORM_FEATURE"
            echo "TASK_FORM_SCOPE=BAH-4970-slider-link-core"
            echo "CARE_INSTRUCTIONS_SOURCE=$UPSTREAM_FEATURE"
            echo "CARE_INSTRUCTIONS_SCOPE=component-style-utils-tests-dashboard-mapping"
            echo "CONTROL_COMMIT=$GITHUB_SHA"
            echo "HARNESS_RECONCILIATION=$HARNESS_RECONCILIATION"
            echo "HARNESS_SOURCE=$UPSTREAM_FEATURE:$HARNESS_RECONCILIATION"
            echo "NOTIFICATION_RECONCILIATION=$NOTIFICATION_RECONCILIATION"
            echo "NOTIFICATION_SOURCE=$UPSTREAM_FEATURE:$NOTIFICATION_RECONCILIATION"
            echo "EN_LOCALE_RECONCILIATION=$EN_LOCALE_RECONCILIATION"
            echo "CARE_VIEW_RECONCILIATION=$CARE_VIEW_RECONCILIATION"
            echo "CARE_VIEW_SOURCE=$UPSTREAM_FEATURE:$CARE_VIEW_RECONCILIATION"
            echo "DASHBOARD_RECONCILIATION=$DASHBOARD_RECONCILIATION"
            echo "UPDATE_NURSING_RECONCILIATION=$UPDATE_NURSING_RECONCILIATION"
            echo "UPDATE_NURSING_SCOPE=stop-unstop-only"
            echo "UPDATE_NURSING_TEST_RECONCILIATION=$UPDATE_NURSING_TEST_RECONCILIATION"
            echo "UPDATE_NURSING_SNAPSHOT_RECONCILIATION=$UPDATE_NURSING_SNAPSHOT_RECONCILIATION"
            echo "UPDATE_NURSING_CANCEL_TEST=deterministic-callback-assertion"
            echo "NOTIFICATION_SNAPSHOT=$NOTIFICATION_SNAPSHOT"
            echo "UPSTREAM_CHANGED_PATHS=$(wc -l < /tmp/upstream-paths.txt)"
            echo "CONFLICT_PATHS=$(wc -l < g6-evidence/conflicts.txt)"
            echo "APPLIED_RECONCILED_PATHS=$(wc -l < g6-evidence/applied-paths.txt)"
            echo "RECONCILED_CONFLICT_PATHS=$TASK_TILE_RECONCILIATION,$TASK_MOCK_RECONCILIATION,$EN_LOCALE_RECONCILIATION,$DASHBOARD_RECONCILIATION,$UPDATE_NURSING_RECONCILIATION,$UPDATE_NURSING_TEST_RECONCILIATION,$UPDATE_NURSING_SNAPSHOT_RECONCILIATION"
          } > g6-evidence/PROVENANCE.txt
          cp /tmp/upstream-paths.txt g6-evidence/upstream-paths.txt
          cat g6-evidence/PROVENANCE.txt

      - name: Use Node.js 14.x
        uses: actions/setup-node@v4
        with:
          node-version: 14.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run targeted Care Instructions acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          TZ=UTC yarn jest --ci --runInBand --runTestsByPath \
            "$CARE_INSTRUCTIONS_TEST" \
            "$CARE_INSTRUCTIONS_UTILS_TEST"

      - name: Build selective candidate
        run: yarn build

      - name: Run existing CI tests
        run: yarn test:ci

      - name: Hash browser artifact
        shell: bash
        run: |
          set -euo pipefail
          find dist/federation -type f -print0 | sort -z | xargs -0 sha256sum > g6-evidence/DIST_SHA256SUMS
          test -s g6-evidence/DIST_SHA256SUMS

      - name: Upload reconciliation evidence and browser candidate
        uses: actions/upload-artifact@v4
        with:
          name: upstream-002-g6-selective-reconciliation-${{ github.sha }}
          path: |
            g6-evidence/
            dist/federation/
          if-no-files-found: error
          retention-days: 14
