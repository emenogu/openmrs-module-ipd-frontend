name: NMHS UPSTREAM-002 BUNDLE-1 IPD frontend publication

on:
  push:
    branches:
      - upstream-002-bundle1-ipd-frontend-publication-v1
    paths:
      - .github/workflows/nmhs-upstream-002-bundle1-ipd-frontend-publication.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.head_commit.message == 'UPSTREAM-002 BUNDLE-1 stage IPD frontend publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: 4ea5ea7a8e4df46d3b201b48b8ecc7f9b82b46d2
      SOURCE_TREE: 3daf6e70c51a727d6b1bd9faf5646bbbae19abed
      IMAGE_REPO: ghcr.io/emenogu/nmhs-modern-ipd
      IMAGE_TAG: upstream-002-bundle1-4ea5ea7a8e4d
    steps:
      - name: Checkout publication control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Checkout exact accepted frontend source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          persist-credentials: false

      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git -C source status --porcelain)"
          echo SOURCE_IDENTITY=PASS

      - uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: yarn
          cache-dependency-path: source/yarn.lock

      - name: Build exact frontend source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile
          yarn build
          yarn test:ci

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable candidate
        id: image
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/package/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true

      - name: Pull back and verify published image
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          ref="$IMAGE_REPO@$DIGEST"
          docker pull --platform linux/amd64 "$ref"
          docker run --rm --entrypoint sh "$ref" -c '
            test -s /usr/local/apache2/htdocs/ipd/remoteEntry.js
            test -s /usr/local/apache2/htdocs/ipd/index.html || true
          '
          {
            echo "COMPONENT=ipd-frontend"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "SOURCE_TREE=$SOURCE_TREE"
            echo "IMAGE_TAG=$IMAGE_REPO:$IMAGE_TAG"
            echo "IMAGE_DIGEST=$DIGEST"
            echo "IMAGE_REF=$ref"
            echo "PLATFORM=linux/amd64"
            echo "LOCAL_TARGET_PULL_BYTES=0"
          } | tee ipd-frontend.provenance
          echo FRONTEND_PUBLICATION=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: bundle1-ipd-frontend-publication-provenance
          path: ipd-frontend.provenance
          if-no-files-found: error
