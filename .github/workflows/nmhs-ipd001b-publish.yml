name: NMHS IPD-001B candidate publication

on:
  pull_request:
    branches:
      - ipd-001b-publication-base-v1
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact authorized candidate
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "ece27565dd63936bd3d70e2bd33b6178dba9e776"

      - name: Use Node.js 14.x
        uses: actions/setup-node@v4
        with:
          node-version: "14.x"

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test:ci

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to NMHS GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable candidate image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: package/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/emenogu/nmhs-ipd-frontend:candidate-ece27565dd63936bd3d70e2bd33b6178dba9e776
