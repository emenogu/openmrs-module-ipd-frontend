name: NMHS UPSTREAM-002 BUNDLE-1 refresh approved snapshots

on:
  push:
    branches:
      - upstream-002-bundle1-ipd-complete-adoption-v1
    paths:
      - .nmhs-controls/upstream-002-bundle1-snapshot-refresh-trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: yarn

      - name: Verify accepted NMHS navigation seam
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'export const homePageUrl = "/bahmni-v2/home/";' src/constants.js
          ! grep -F 'export const homePageUrl = "/bahmni/home/#/dashboard";' src/constants.js

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Refresh snapshots from current Bundle-1 behavior
        run: yarn test:ci -u

      - name: Fail closed on snapshot scope
        shell: bash
        run: |
          set -euo pipefail

          allowed="$(mktemp)"
          changed="$(mktemp)"

          cat > "$allowed" <<'LIST'
src/entries/CareViewDashboard/__snapshots__/CareViewDashboard.spec.jsx.snap
src/features/CareViewPatientsSummary/tests/__snapshots__/CareViewPatientsSummary.spec.jsx.snap
src/features/CareViewPatientsSummary/tests/__snapshots__/PatientDetailsCell.spec.jsx.snap
src/features/DisplayControls/NursingTasks/tests/__snapshots__/AddEmergencyTasks.spec.jsx.snap
src/features/DisplayControls/NursingTasks/tests/__snapshots__/TaskTile.spec.jsx.snap
LIST

          git status --porcelain |
            sed 's/^...//' |
            sort -u > "$changed"

          echo '=== CHANGED AFTER SNAPSHOT REFRESH ==='
          cat "$changed"

          test -s "$changed"

          unexpected="$(comm -23 "$changed" <(sort -u "$allowed"))"
          if [ -n "$unexpected" ]; then
            echo 'FAIL: unexpected file changes'
            printf '%s\n' "$unexpected"
            exit 1
          fi

          echo 'SNAPSHOT_SCOPE=PASS'

      - name: Commit approved snapshots only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'NMHS Hosted Validation'
          git config user.email 'actions@users.noreply.github.com'

          git add --             src/entries/CareViewDashboard/__snapshots__/CareViewDashboard.spec.jsx.snap             src/features/CareViewPatientsSummary/tests/__snapshots__/CareViewPatientsSummary.spec.jsx.snap             src/features/CareViewPatientsSummary/tests/__snapshots__/PatientDetailsCell.spec.jsx.snap             src/features/DisplayControls/NursingTasks/tests/__snapshots__/AddEmergencyTasks.spec.jsx.snap             src/features/DisplayControls/NursingTasks/tests/__snapshots__/TaskTile.spec.jsx.snap

          test -n "$(git diff --cached --name-only)"

          git commit -m 'UPSTREAM-002 BUNDLE-1 align snapshots with accepted feature behavior'
          git push origin HEAD:upstream-002-bundle1-ipd-complete-adoption-v1
