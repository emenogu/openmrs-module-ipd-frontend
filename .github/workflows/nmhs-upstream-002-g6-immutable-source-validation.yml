name: NMHS UPSTREAM-002 G6 Immutable Source Validation

on:
  push:
    branches:
      - upstream-002-g6-immutable-source-candidate-v1
    paths:
      - .github/workflows/nmhs-upstream-002-g6-immutable-source-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: 61006dabde029d167cb0193c6e35edd172634536
      CONTROL_BASE: f8177a8fc0324652c8335ee09590aa0c39fa0ab3
      UPSTREAM: 6afeda361e3e321e7dd3d764016d1d5941ce7c6c
      UPSTREAM_PARENT: b3f3ba60cc3fe39f064d3f85e137e48f1418f5f0
      ACCEPTED_BASE: d85ee48226a2d4c9831c9adaa5ac06e3584d6dc7
    steps:
      - name: Checkout exact materialized source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact upstream aggregate
        shell: bash
        run: |
          set -euo pipefail
          git remote remove bahmni-upstream 2>/dev/null || true
          git remote add bahmni-upstream https://github.com/Bahmni/openmrs-module-ipd-frontend.git
          git fetch --no-tags bahmni-upstream "$UPSTREAM"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM"
          test "$(git rev-parse "$UPSTREAM^")" = "$UPSTREAM_PARENT"

      - name: Validate materialized reconciliation model
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -z "$(git status --porcelain)"

          git diff --name-only "$UPSTREAM_PARENT" "$UPSTREAM" | sort > /tmp/upstream-paths.txt
          test "$(wc -l < /tmp/upstream-paths.txt)" -eq 51

          cat > /tmp/preserved-conflicts.txt <<'EOF'
          public/i18n/locale_en.json
          src/entries/Dashboard/Dashboard.jsx
          src/features/DisplayControls/NursingTasks/components/TaskTile.jsx
          src/features/DisplayControls/NursingTasks/components/UpdateNursingTasks.jsx
          src/features/DisplayControls/NursingTasks/tests/UpdateNursingTasks.spec.jsx
          src/features/DisplayControls/NursingTasks/tests/__snapshots__/UpdateNursingTasks.spec.jsx.snap
          EOF
          sed -i 's/^          //' /tmp/preserved-conflicts.txt
          sort -o /tmp/preserved-conflicts.txt /tmp/preserved-conflicts.txt

          cat > /tmp/absent-locales.txt <<'EOF'
          public/i18n/locale_es.json
          public/i18n/locale_fr.json
          public/i18n/locale_it.json
          public/i18n/locale_pt.json
          EOF
          sed -i 's/^          //' /tmp/absent-locales.txt
          sort -o /tmp/absent-locales.txt /tmp/absent-locales.txt

          TASK_MOCK="src/features/DisplayControls/NursingTasks/tests/NursingTasksUtilsMockData.js"
          TASK_TILE_TEST="src/features/DisplayControls/NursingTasks/tests/TaskTile.spec.jsx"

          # Six reviewed conflict files remain byte-identical to the prior accepted G6 control head.
          while IFS= read -r p; do
            before="$(git show "$CONTROL_BASE:$p" | sha256sum | awk '{print $1}')"
            after="$(sha256sum "$p" | awk '{print $1}')"
            test "$before" = "$after"
          done < /tmp/preserved-conflicts.txt
          echo "CHECKPOINT preserved-conflicts PASS"

          # Optional locale files remain intentionally absent.
          while IFS= read -r p; do
            test ! -e "$p"
          done < /tmp/absent-locales.txt
          echo "CHECKPOINT absent-locales PASS"

          # All clean aggregate paths except the one deliberate TaskTile test 3-way merge
          # are exact upstream bytes. The stopped-task mock is a documented bounded reconciliation.
          comm -23 /tmp/upstream-paths.txt /tmp/preserved-conflicts.txt             | comm -23 - /tmp/absent-locales.txt             | grep -Fvx "$TASK_MOCK"             | grep -Fvx "$TASK_TILE_TEST"             > /tmp/exact-upstream-paths.txt

          test "$(wc -l < /tmp/exact-upstream-paths.txt)" -eq 39
          while IFS= read -r p; do
            git show "$UPSTREAM:$p" > /tmp/upstream-file
            diff -u /tmp/upstream-file "$p"
          done < /tmp/exact-upstream-paths.txt
          echo "CHECKPOINT exact-upstream-paths PASS"

          # TaskTile test combines NMHS compatibility behavior with the exact upstream stopped-task delta.
          grep -Fq 'mockStoppedNonMedicationTileData' "$TASK_TILE_TEST"
          grep -Fq 'expect(getByText("(1 more task(s))")).toBeTruthy();' "$TASK_TILE_TEST"
          grep -Fq 'should render stopped icon when non-medication task status is Stopped' "$TASK_TILE_TEST"
          grep -Fq 'expect(getByText("16:38 - 07:10 (actual)")).toBeTruthy();' "$TASK_TILE_TEST"
          grep -Fq 'expect(getByText("04:38 PM - 07:10 AM (actual)")).toBeTruthy();' "$TASK_TILE_TEST"
          echo "CHECKPOINT tasktile-test-reconciliation PASS"

          # Stopped-task fixture reconciliation: exactly one inserted upstream fixture on accepted NMHS base.
          test "$(grep -c '^export const mockStoppedNonMedicationTileData = ' "$TASK_MOCK")" -eq 1
          git show "$UPSTREAM:$TASK_MOCK" > /tmp/upstream-task-mock.js
          python3 - <<'PY'
          import re, subprocess, pathlib
          accepted = subprocess.check_output([
              "git","show",
              "d85ee48226a2d4c9831c9adaa5ac06e3584d6dc7:src/features/DisplayControls/NursingTasks/tests/NursingTasksUtilsMockData.js"
          ], text=True)
          upstream = pathlib.Path("/tmp/upstream-task-mock.js").read_text()
          actual = pathlib.Path("src/features/DisplayControls/NursingTasks/tests/NursingTasksUtilsMockData.js").read_text()
          m = re.search(r"export const mockStoppedNonMedicationTileData = \[.*?\];\n\n", upstream, re.S)
          if not m:
              raise SystemExit("STOP: upstream stopped fixture missing")
          anchor = "export const mockShiftResponse = ["
          expected = accepted.replace(anchor, m.group(0) + anchor, 1)
          if actual != expected:
              raise SystemExit("STOP: stopped fixture reconciliation mismatch")
          PY
          echo "CHECKPOINT stopped-task-fixture PASS"

          # Critical source feature markers must now exist in the actual immutable branch tree.
          grep -Fq 'TaskFormLink' src/features/DisplayControls/NursingTasks/components/UpdateNursingTasks.jsx
          grep -Fq 'enableStopTasks' src/features/DisplayControls/NursingTasks/components/UpdateNursingTasks.jsx
          grep -Fq 'saveBulkNonMedicationTasks' src/features/DisplayControls/NursingTasks/components/AddEmergencyTasks.jsx
          grep -Fq 'enableDateSelection: true' src/features/DisplayControls/NursingTasks/components/AddEmergencyTasks.jsx
          grep -Fq 'maxFutureDaysAllowed: 60' src/features/DisplayControls/NursingTasks/components/AddEmergencyTasks.jsx
          grep -Fq 'getPreviousShiftDetails' src/features/CareViewPatientsSummary/components/CareViewPatientsSummary.jsx
          test -f src/features/DisplayControls/CareInstructions/components/CareInstructions.jsx
          test -f src/features/DisplayControls/CareInstructions/utils/CareInstructionsUtils.jsx
          echo "CHECKPOINT critical-feature-markers PASS"

          echo "Materialized G6 source reconciliation model: PASS"

      - name: Use Node.js 14.x
        uses: actions/setup-node@v4
        with:
          node-version: 14.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run targeted G6 acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          TZ=UTC yarn jest --ci --runInBand --runTestsByPath             src/features/DisplayControls/CareInstructions/tests/CareInstructions.spec.jsx             src/features/DisplayControls/CareInstructions/utils/CareInstructionsUtils.test.js             src/features/CareViewPatientsSummary/tests/CareViewPatientsSummary.spec.jsx             src/features/CareViewPatientsSummary/tests/Header.spec.jsx             src/features/CareViewPatientsSummary/tests/PatientDetailsCell.spec.jsx             src/features/CareViewPatients/test/CareViewPatients.spec.jsx             src/features/CareViewPatients/test/CareViewPatientsHeader.spec.jsx             src/features/DisplayControls/NursingTasks/tests/AddEmergencyTasks.spec.jsx             src/features/DisplayControls/NursingTasks/tests/TaskTile.spec.jsx             src/features/DisplayControls/NursingTasks/tests/UpdateNursingTasks.spec.jsx

      - name: Build immutable source candidate
        run: yarn build

      - name: Run existing CI suite
        run: TZ=UTC yarn test:ci

      - name: Record immutable source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g6-immutable-evidence
          {
            echo "SOURCE=$SOURCE"
            echo "CONTROL_BASE=$CONTROL_BASE"
            echo "ACCEPTED_BASE=$ACCEPTED_BASE"
            echo "UPSTREAM=$UPSTREAM"
            echo "UPSTREAM_PARENT=$UPSTREAM_PARENT"
            echo "UPSTREAM_CHANGED_PATHS=51"
            echo "EXACT_UPSTREAM_PATHS=39"
            echo "PRESERVED_CONFLICT_PATHS=6"
            echo "ABSENT_LOCALES=4"
            echo "BOUNDED_RECONCILIATIONS=2"
            echo "PRODUCTION=NO-GO"
            echo "REHEARSAL_DEPLOYMENT=PROHIBITED"
          } > g6-immutable-evidence/PROVENANCE.txt
          git diff --name-only "$CONTROL_BASE" "$SOURCE" | sort > g6-immutable-evidence/materialized-delta.txt
          sha256sum g6-immutable-evidence/*

      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: upstream-002-g6-immutable-source-${{ env.SOURCE }}
          path: g6-immutable-evidence
          if-no-files-found: error
          retention-days: 14
