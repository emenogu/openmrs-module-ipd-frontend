name: NMHS UPSTREAM-002 BUNDLE-1 IPD frontend validation

on:
  push:
    branches:
      - upstream-002-bundle1-ipd-complete-adoption-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: yarn

      - name: Verify Bundle-1 feature surface
        shell: bash
        run: |
          set -euo pipefail

          grep -R -F 'enableAddMultipleTask' src
          grep -R -F 'enableStopTasks' src
          grep -R -F 'nursingTaskScheduling' src
          grep -R -F 'CANCELLED' src/features/DisplayControls/NursingTasks
          grep -R -F 'REQUESTED' src/features/DisplayControls/NursingTasks
          grep -R -F 'focus:' src/features/DisplayControls/NursingTasks
          grep -R -F 'basedOn:' src/features/DisplayControls/NursingTasks
          grep -R -F 'FHIR_TASK_URL' src
          grep -R -F 'enableNurseAcknowledgement' src

      - name: Verify unrelated upstream areas were not adopted
        shell: bash
        run: |
          set -euo pipefail
          changed="$(mktemp)"

          git diff --name-only \
            beeb307d192f7e4e4fc7177fbc6b9bf5ee7d7809...HEAD \
            > "$changed"

          if grep -E '(^|/)(Allergies|DrugChart|AmendmentHistory|DraftIndicator)/' "$changed"; then
            echo 'FAIL: unrelated upstream feature area entered Bundle-1'
            exit 1
          fi

      - name: Verify accepted snapshot inventory
        shell: bash
        run: |
          set -euo pipefail

          printf '%s  %s\n' \
            '208e4eefdf56cfc5f292f949fcf3e788aa13cbd04db2fea52cd545c796f1d99b' 'src/features/CareViewPatientsSummary/tests/__snapshots__/CareViewPatientsSummary.spec.jsx.snap' \
            '8aad8c206df0c47a6ae45643966e6765473437007cdb8f2c16ca920bd71200d4' 'src/features/CareViewPatientsSummary/tests/__snapshots__/PatientDetailsCell.spec.jsx.snap' \
            '5c3b1b027e2b41d0c372a23fc12bd4310d347d8b40617e1bf5eeaf3a6dd87cfb' 'src/entries/CareViewDashboard/__snapshots__/CareViewDashboard.spec.jsx.snap' \
            '1265aa6e03e03a9b78d6b91945a360c5a991ca7a709f047276199217c3800799' 'src/features/DisplayControls/NursingTasks/tests/__snapshots__/AddEmergencyTasks.spec.jsx.snap' \
            '189a47d095f439873e4b1cefcb875bf2eb4a232571eba6814e4da30199999a88' 'src/features/DisplayControls/NursingTasks/tests/__snapshots__/TaskTile.spec.jsx.snap' \
            | sha256sum -c -

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test:ci

      - name: Verify clean post-validation state
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain
          test -z "$(git status --porcelain)"
          echo 'FINAL_FRONTEND_VALIDATION=PASS'
