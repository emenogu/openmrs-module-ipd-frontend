name: NMHS UPSTREAM-002 IPD-ADOPT-001B Frontend Immutable Publication

on:
  push:
    branches:
      - upstream-002-ipd-adopt-001b-publication-v1

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      SOURCE_COMMIT: beeb307d192f7e4e4fc7177fbc6b9bf5ee7d7809
      VALIDATION_CONTROL: 398a1e3510be97a2268386ab423058dddae86c83
      VALIDATION_RUN: "37537468794"
      ARTIFACT_ID: "11447745360"
      ARTIFACT_DIGEST: c19a62c71e6487ad5a7670a3626bff1b0c1c566a4723d73c71e88f41d6c947fe
      BASE_IMAGE: ghcr.io/emenogu/nmhs-modern-ipd@sha256:3ff4baef4ab19e957d9930b0d54f2ed0e161d8b003e7e5e0ad333c5c5bf0b3b7
      IMAGE_NAME: ghcr.io/emenogu/nmhs-modern-ipd
      IMAGE_TAG: ipd-adopt-001b-beeb307d

    steps:
      - name: Checkout publication control
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Verify accepted validation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$VALIDATION_CONTROL" HEAD

          python3 - <<'PY'
          import json, os, urllib.request
          repo="emenogu/openmrs-module-ipd-frontend"
          run_id=int(os.environ["VALIDATION_RUN"])
          artifact_id=int(os.environ["ARTIFACT_ID"])
          control=os.environ["VALIDATION_CONTROL"]
          digest="sha256:"+os.environ["ARTIFACT_DIGEST"]
          token=os.environ["GH_TOKEN"]

          def api(path):
              req=urllib.request.Request(
                  "https://api.github.com"+path,
                  headers={
                      "Authorization":"Bearer "+token,
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  })
              with urllib.request.urlopen(req,timeout=60) as response:
                  return json.load(response)

          run=api(f"/repos/{repo}/actions/runs/{run_id}")
          assert run["status"]=="completed"
          assert run["conclusion"]=="success"
          assert run["head_sha"]==control

          artifacts=api(f"/repos/{repo}/actions/runs/{run_id}/artifacts")
          found=[a for a in artifacts["artifacts"] if a["id"]==artifact_id]
          assert len(found)==1
          artifact=found[0]
          assert artifact["expired"] is False
          assert artifact["digest"]==digest
          PY

      - name: Download exact validated frontend artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          url="https://api.github.com/repos/emenogu/openmrs-module-ipd-frontend/actions/artifacts/$ARTIFACT_ID/zip"

          curl --fail --silent --show-error --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "$url" -o "$RUNNER_TEMP/ipd.zip"

          test "$(sha256sum "$RUNNER_TEMP/ipd.zip" | awk '{print $1}')" = "$ARTIFACT_DIGEST"

          mkdir -p "$RUNNER_TEMP/ipd"
          python3 - "$RUNNER_TEMP/ipd.zip" "$RUNNER_TEMP/ipd" <<'PY'
          import pathlib, sys, zipfile
          archive=pathlib.Path(sys.argv[1])
          dest=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  path=pathlib.PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("unsafe artifact path")
              z.extractall(dest)
          PY

          grep -Fxq "SOURCE_COMMIT=$SOURCE_COMMIT" "$RUNNER_TEMP/ipd/provenance.txt"
          cd "$RUNNER_TEMP/ipd"
          sha256sum -c federation-sha256.txt
          test -f dist/federation/remoteEntry.js

      - name: Authenticate GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Fail closed if destination exists
        shell: bash
        run: |
          set -euo pipefail
          target="$IMAGE_NAME:$IMAGE_TAG"
          set +e
          output="$(docker manifest inspect "$target" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "STOP: destination exists" >&2
            exit 1
          fi
          case "$output" in
            *"manifest unknown"*|*"no such manifest"*|*"not found"*|*"name unknown"*) ;;
            *) printf '%s\n' "$output" >&2; exit 1 ;;
          esac

      - name: Build exact frontend derivative
        shell: bash
        run: |
          set -euo pipefail

          docker pull --platform linux/amd64 "$BASE_IMAGE"

          context="$RUNNER_TEMP/ipd-context"
          mkdir -p "$context/runtime-stage"
          cp -a "$RUNNER_TEMP/ipd/dist/federation/." "$context/runtime-stage/"

          cat > "$context/Dockerfile" <<EOF
          FROM $BASE_IMAGE
          RUN rm -rf /usr/local/apache2/htdocs/ipd/*
          COPY runtime-stage/. /usr/local/apache2/htdocs/ipd/
          EOF

          docker build             --platform linux/amd64             --pull=false             --network=none             --no-cache             --label "nmhs.gate=UPSTREAM-002-IPD-ADOPT-001B"             --label "nmhs.source.commit=$SOURCE_COMMIT"             --label "nmhs.validation.run=$VALIDATION_RUN"             -t "$IMAGE_NAME:$IMAGE_TAG"             "$context"

      - name: Verify local runtime byte equivalence
        shell: bash
        run: |
          set -euo pipefail

          cid="$(docker create "$IMAGE_NAME:$IMAGE_TAG")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          mkdir -p "$RUNNER_TEMP/local"
          docker cp "$cid:/usr/local/apache2/htdocs/ipd/." "$RUNNER_TEMP/local/"

          python3 - "$RUNNER_TEMP/ipd/dist/federation" "$RUNNER_TEMP/local" <<'PY'
          from pathlib import Path
          import hashlib, sys

          def inv(root):
              root=Path(root)
              return {
                  p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob("*") if p.is_file()
              }

          assert inv(sys.argv[1]) == inv(sys.argv[2])
          print("LOCAL_RUNTIME_EQUIVALENCE=PASS")
          PY

      - name: Push immutable frontend candidate
        shell: bash
        run: |
          set -euo pipefail

          log="$RUNNER_TEMP/push.log"
          docker push "$IMAGE_NAME:$IMAGE_TAG" | tee "$log"

          digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' "$log" | tail -n 1)"
          test -n "$digest"

          echo "PUBLISHED_DIGEST=$digest" >> "$GITHUB_ENV"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/published-digest.txt"

      - name: Pullback verify frontend candidate
        shell: bash
        run: |
          set -euo pipefail

          immutable="$IMAGE_NAME@$PUBLISHED_DIGEST"
          docker pull --platform linux/amd64 "$immutable"

          cid="$(docker create "$immutable")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          mkdir -p "$RUNNER_TEMP/pullback"
          docker cp "$cid:/usr/local/apache2/htdocs/ipd/." "$RUNNER_TEMP/pullback/"

          python3 - "$RUNNER_TEMP/ipd/dist/federation" "$RUNNER_TEMP/pullback" <<'PY'
          from pathlib import Path
          import hashlib, sys

          def inv(root):
              root=Path(root)
              return {
                  p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob("*") if p.is_file()
              }

          assert inv(sys.argv[1]) == inv(sys.argv[2])
          print("PULLBACK_RUNTIME_EQUIVALENCE=PASS")
          PY

      - name: Record publication evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p evidence
          cp "$RUNNER_TEMP/published-digest.txt" evidence/
          cp "$RUNNER_TEMP/ipd/provenance.txt" evidence/source-provenance.txt
          cp "$RUNNER_TEMP/ipd/federation-sha256.txt" evidence/

          {
            printf 'PUBLICATION_CONTROL=%s\n' "$GITHUB_SHA"
            printf 'SOURCE_COMMIT=%s\n' "$SOURCE_COMMIT"
            printf 'VALIDATION_RUN=%s\n' "$VALIDATION_RUN"
            printf 'BASE_IMAGE=%s\n' "$BASE_IMAGE"
            printf 'IMMUTABLE_REFERENCE=%s@%s\n' "$IMAGE_NAME" "$PUBLISHED_DIGEST"
            printf 'REHEARSAL_MUTATION=NO\n'
            printf 'PRODUCTION_MUTATION=NO\n'
          } > evidence/publication-provenance.txt

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: nmhs-ipd-adopt-001b-frontend-publication
          if-no-files-found: error
          retention-days: 30
          path: evidence
