name: NMHS UPSTREAM-002 BUNDLE-1 bounded snapshot acceptance

on:
  push:
    branches:
      - upstream-002-bundle1-ipd-complete-adoption-v1

permissions:
  actions: read
  contents: write

jobs:
  accept:
    if: github.event.head_commit.message == 'UPSTREAM-002 BUNDLE-1 stage bounded snapshot acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify immutable acceptance source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b45db510979d140846b474d0d0a7e2caea750ff6"
          test "$(git status --porcelain)" = ""

      - name: Download validated snapshot artifact
        uses: actions/download-artifact@v4
        with:
          name: bundle1-frontend-snapshot-candidates
          path: /tmp/bundle1-snapshots
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37595459272

      - name: Verify and stage exact snapshot bytes
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp/bundle1-snapshots
          printf '%s  %s\n' \
            '208e4eefdf56cfc5f292f949fcf3e788aa13cbd04db2fea52cd545c796f1d99b' 'features/CareViewPatientsSummary/tests/__snapshots__/CareViewPatientsSummary.spec.jsx.snap' \
            '8aad8c206df0c47a6ae45643966e6765473437007cdb8f2c16ca920bd71200d4' 'features/CareViewPatientsSummary/tests/__snapshots__/PatientDetailsCell.spec.jsx.snap' \
            '5c3b1b027e2b41d0c372a23fc12bd4310d347d8b40617e1bf5eeaf3a6dd87cfb' 'entries/CareViewDashboard/__snapshots__/CareViewDashboard.spec.jsx.snap' \
            '1265aa6e03e03a9b78d6b91945a360c5a991ca7a709f047276199217c3800799' 'features/DisplayControls/NursingTasks/tests/__snapshots__/AddEmergencyTasks.spec.jsx.snap' \
            '189a47d095f439873e4b1cefcb875bf2eb4a232571eba6814e4da30199999a88' 'features/DisplayControls/NursingTasks/tests/__snapshots__/TaskTile.spec.jsx.snap' \
            | sha256sum -c -

          cd "$GITHUB_WORKSPACE"
          cp /tmp/bundle1-snapshots/features/CareViewPatientsSummary/tests/__snapshots__/CareViewPatientsSummary.spec.jsx.snap src/features/CareViewPatientsSummary/tests/__snapshots__/CareViewPatientsSummary.spec.jsx.snap
          cp /tmp/bundle1-snapshots/features/CareViewPatientsSummary/tests/__snapshots__/PatientDetailsCell.spec.jsx.snap src/features/CareViewPatientsSummary/tests/__snapshots__/PatientDetailsCell.spec.jsx.snap
          cp /tmp/bundle1-snapshots/entries/CareViewDashboard/__snapshots__/CareViewDashboard.spec.jsx.snap src/entries/CareViewDashboard/__snapshots__/CareViewDashboard.spec.jsx.snap
          cp /tmp/bundle1-snapshots/features/DisplayControls/NursingTasks/tests/__snapshots__/AddEmergencyTasks.spec.jsx.snap src/features/DisplayControls/NursingTasks/tests/__snapshots__/AddEmergencyTasks.spec.jsx.snap
          cp /tmp/bundle1-snapshots/features/DisplayControls/NursingTasks/tests/__snapshots__/TaskTile.spec.jsx.snap src/features/DisplayControls/NursingTasks/tests/__snapshots__/TaskTile.spec.jsx.snap

          allowed="$(mktemp)"
          changed="$(mktemp)"
          printf '%s\n' \
            'src/entries/CareViewDashboard/__snapshots__/CareViewDashboard.spec.jsx.snap' \
            'src/features/CareViewPatientsSummary/tests/__snapshots__/CareViewPatientsSummary.spec.jsx.snap' \
            'src/features/CareViewPatientsSummary/tests/__snapshots__/PatientDetailsCell.spec.jsx.snap' \
            'src/features/DisplayControls/NursingTasks/tests/__snapshots__/AddEmergencyTasks.spec.jsx.snap' \
            'src/features/DisplayControls/NursingTasks/tests/__snapshots__/TaskTile.spec.jsx.snap' \
            | sort -u > "$allowed"
          git diff --name-only | sort -u > "$changed"
          diff -u "$allowed" "$changed"

      - name: Commit accepted snapshot set
        shell: bash
        run: |
          set -euo pipefail

          expected_head="${GITHUB_SHA}"
          remote_head="$(git ls-remote origin refs/heads/upstream-002-bundle1-ipd-complete-adoption-v1 | cut -f1)"
          test "$remote_head" = "$expected_head"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/entries/CareViewDashboard/__snapshots__/CareViewDashboard.spec.jsx.snap \
            src/features/CareViewPatientsSummary/tests/__snapshots__/CareViewPatientsSummary.spec.jsx.snap \
            src/features/CareViewPatientsSummary/tests/__snapshots__/PatientDetailsCell.spec.jsx.snap \
            src/features/DisplayControls/NursingTasks/tests/__snapshots__/AddEmergencyTasks.spec.jsx.snap \
            src/features/DisplayControls/NursingTasks/tests/__snapshots__/TaskTile.spec.jsx.snap

          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m "UPSTREAM-002 BUNDLE-1 accept bounded snapshot candidates"
          git push origin HEAD:upstream-002-bundle1-ipd-complete-adoption-v1
